name: PR gate

on:
  pull_request:
    branches: [main]
  # Also run after merge, so `main` itself is proven green, not just the PR branch.
  push:
    branches: [main]

# Least privilege: these jobs only read the code. A compromised step can't push or edit the repo.
permissions:
  contents: read

# A new push to the same PR cancels the now-outdated run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Job names (`lint`, `typecheck`) become required status checks in Step 4. Renaming them later
# silently breaks the ruleset, so treat them as a stable API.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA: a tag like `v7` can be moved to
      # different code by whoever controls it; a SHA cannot. The comment keeps it readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    # Sequential per the spec (lint → typecheck → smoke): cheap checks fail fast before
    # spending minutes on later ones.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
